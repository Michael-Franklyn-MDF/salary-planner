<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9F0EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const raw = window.localStorage.getItem('salary-planner-prefs')
          const preference = raw ? JSON.parse(raw).theme : 'system'
          if (preference === 'light' || preference === 'dark') {
            document.documentElement.dataset.theme = preference
          }
        } catch {
          // System theme is the safe fallback before React loads.
        }
      })()
    </script>
    <title>Salary Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
